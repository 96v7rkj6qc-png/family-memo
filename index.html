<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家族メモ</title>
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家族メモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="list-title">家族メモ</h1>
    <button id="btn-settings" class="icon-btn" aria-label="設定">⚙</button>
  </header>
  <nav id="tabs" class="tabs" aria-label="リスト切り替え"></nav>
  <main id="items" class="list"></main>
  <form id="add-form" class="bar" autocomplete="off">
    <button type="button" id="btn-presets" class="presets-btn">定番</button>
    <input id="add-input" class="in" type="text" enterkeyhint="done" placeholder="項目を追加…" aria-label="項目を追加" maxlength="200">
    <button class="add" type="submit" aria-label="追加">＋</button>
  </form>
</div>
<div id="modal-root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
